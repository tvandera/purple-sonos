name: Test Perl

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'perl/**'
      - '.github/workflows/test-perl.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'perl/**'
      - '.github/workflows/test-perl.yml'

jobs:
  test:
    name: Perl ${{ matrix.perl-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        perl-version: [ '5.40' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl-version }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install dependencies via cpanfile
        working-directory: ./perl
        run: |
          cpan App::cpanminus
          cpanm --installdeps .

      - name: Run tests
        working-directory: ./perl
        run: |
          perl -Ilib -e 'use Test::Harness; runtests(<t/*.t>)'
