name: Test Perl

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'perl/**'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/test-perl.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'perl/**'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/test-perl.yml'

jobs:
  test:
    name: Perl Tests
    runs-on: ubuntu-latest
    container:
      image: perl:latest
      options: >-
        --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential curl libgd-dev locales nodejs npm
          curl -fsSL "https://github.com/skaji/cpm/releases/download/v1.1.6/cpm" \
              -o /usr/local/bin/cpm
          chmod +x /usr/local/bin/cpm
          cpm install --global Carton

      - name: Cache Carton dependencies
        uses: actions/cache@v4
        with:
          path: |
            perl/local
            ~/.cpanm
          key: carton-${{ runner.os }}-${{ hashFiles('perl/cpanfile.snapshot') }}
          restore-keys: |
            carton-${{ runner.os }}-

      - name: Install Perl dependencies
        working-directory: ./perl
        run: carton install

      - name: Run tests
        working-directory: ./perl
        run: carton exec -- perl -Ilib -e 'use Test::Harness; runtests(<t/*.t>)'
